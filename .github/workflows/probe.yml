name: Probe

# One-off, started by hand: which tags does GitHub let the workflow's own token create?
# Not part of the release, and npm trusts only release.yml.
on:
  workflow_dispatch:

permissions: {}

jobs:
  tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The commit before the one the run is on changes no workflow file.
      - name: A tag on an older commit whose workflow files are the same
        run: git diff --stat HEAD~1 HEAD -- .github/ && git tag probe-previous HEAD~1 && git push origin refs/tags/probe-previous
